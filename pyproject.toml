[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-rag"
version = "0.1.0"
description = "Local evidence-first quantitative research assistant"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "pypdf>=6,<7",
  "numpy>=2,<3", "faiss-cpu>=1.10,<2", "sentence-transformers>=3,<7",
  "streamlit>=1.40,<2",
  "fonttools>=4,<5", "scikit-learn>=1.5,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
quant-rag = "quant_rag.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
